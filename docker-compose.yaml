services:

  api-gateway:
    image: api-gateway:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACTIVE_PROFILE: docker
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      SERVER_PORT: ${SERVER_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      EMPLOYEE_SERVICE_HOST: ${EMPLOYEE_SERVICE_HOST}
      EMPLOYEE_SERVICE_PORT: ${EMPLOYEE_SERVICE_PORT}
      PROJECT_SERVICE_HOST: ${PROJECT_SERVICE_HOST}
      PROJECT_SERVICE_PORT: ${PROJECT_SERVICE_PORT}
      CAREER_SERVICE_HOST: ${CAREER_SERVICE_HOST}
      CAREER_SERVICE_PORT: ${CAREER_SERVICE_PORT}
      TIME_SERVICE_HOST: ${TIME_SERVICE_HOST}
      TIME_SERVICE_PORT: ${TIME_SERVICE_PORT}
      ANALYTIC_SERVICE_HOST: ${ANALYTIC_SERVICE_HOST}
      ANALYTIC_SERVICE_PORT: ${ANALYTIC_SERVICE_PORT}

    depends_on:
      auth-service:
        condition: service_started
      employee-service:
        condition: service_started
      project-service:
        condition: service_started
      career-service:
        condition: service_started
      time-service:
        condition: service_started
      analytic-service:
        condition: service_started
      intelligent-service:
        condition: service_started

    networks:
      - auth-service-network
      - employee-service-network
      - project-service-network
      - career-service-network
      - time-service-network
      - analytic-service-network
      - intelligent-service-network
      - kafka-network

  auth-service:
    image: auth-service:1.0
    build:
      context: ../auth-service
      dockerfile: Dockerfile

    container_name: auth-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACTIVE_PROFILE: docker
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      SERVER_PORT: ${AUTH_SERVICE_PORT}

      POSTGRES_HOST: ${AUTH_POSTGRES_HOST}
      POSTGRES_PORT: ${AUTH_POSTGRES_PORT}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${AUTH_SERVICE_CORS_ALLOWED_ORIGINS}

      EMPLOYEE_SERVICE_HOST: ${EMPLOYEE_SERVICE_HOST}
      EMPLOYEE_SERVICE_PORT: ${EMPLOYEE_SERVICE_PORT}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

    networks:
      - auth-service-network
      - employee-service-network
      - kafka-network

  auth-postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}

    ports:
      - "${AUTH_POSTGRES_HOST_PORT}:${AUTH_POSTGRES_PORT}"

    command: -p ${AUTH_POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -p ${AUTH_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

    networks:
      - auth-service-network

  auth-db-init:
    image: postgres:17
    container_name: auth-db-init
    restart: "no"

    environment:
      PGPASSWORD: ${AUTH_POSTGRES_PASSWORD}
      PGHOST: auth-postgres
      PGPORT: ${AUTH_POSTGRES_PORT}
      PGUSER: ${AUTH_POSTGRES_USER}
      TARGET_DB: ${AUTH_POSTGRES_DB}

    depends_on:
      auth-postgres:
        condition: service_healthy

    volumes:
      - ../docker/ensure-postgres-db.sh:/ensure-postgres-db.sh:ro

    entrypoint: ["/bin/sh", "/ensure-postgres-db.sh"]

    networks:
      - auth-service-network

  employee-service:
    image: employee-service:1.0
    build:
      context: ../employee-service
      dockerfile: Dockerfile

    container_name: employee-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACTIVE_PROFILE: docker
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      SERVER_PORT: ${EMPLOYEE_SERVICE_PORT}

      POSTGRES_HOST: ${EMPLOYEE_POSTGRES_HOST}
      POSTGRES_PORT: ${EMPLOYEE_POSTGRES_PORT}
      POSTGRES_DB: ${EMPLOYEE_POSTGRES_DB}
      POSTGRES_USER: ${EMPLOYEE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EMPLOYEE_POSTGRES_PASSWORD}

      REDIS_HOST: ${EMPLOYEE_REDIS_HOST}
      REDIS_PORT: ${EMPLOYEE_REDIS_PORT}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_MAX_FILE_SIZE: ${MINIO_MAX_FILE_SIZE}
      MINIO_PRESIGN_TTL_SECONDS: ${MINIO_PRESIGN_TTL_SECONDS}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${EMPLOYEE_SERVICE_CORS_ALLOWED_ORIGINS}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      employee-postgres:
        condition: service_healthy
      employee-db-init:
        condition: service_completed_successfully
      employee-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

    networks:
      - employee-service-network
      - kafka-network

  employee-postgres:
    image: postgres:17
    container_name: employee-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${EMPLOYEE_POSTGRES_DB}
      POSTGRES_USER: ${EMPLOYEE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EMPLOYEE_POSTGRES_PASSWORD}

    ports:
      - "${EMPLOYEE_POSTGRES_HOST_PORT}:${EMPLOYEE_POSTGRES_PORT}"

    command: -p ${EMPLOYEE_POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EMPLOYEE_POSTGRES_USER} -p ${EMPLOYEE_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - employee-postgres-data:/var/lib/postgresql/data

    networks:
      - employee-service-network

  employee-db-init:
    image: postgres:17
    container_name: employee-db-init
    restart: "no"

    environment:
      PGPASSWORD: ${EMPLOYEE_POSTGRES_PASSWORD}
      PGHOST: employee-postgres
      PGPORT: ${EMPLOYEE_POSTGRES_PORT}
      PGUSER: ${EMPLOYEE_POSTGRES_USER}
      TARGET_DB: ${EMPLOYEE_POSTGRES_DB}

    depends_on:
      employee-postgres:
        condition: service_healthy

    volumes:
      - ../docker/ensure-postgres-db.sh:/ensure-postgres-db.sh:ro

    entrypoint: ["/bin/sh", "/ensure-postgres-db.sh"]

    networks:
      - employee-service-network

  employee-redis:
    image: redis:8-alpine
    container_name: employee-redis
    restart: unless-stopped

    ports:
      - "${EMPLOYEE_REDIS_HOST_PORT}:${EMPLOYEE_REDIS_PORT}"

    volumes:
      - employee-redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - employee-service-network

  employee-minio:
    image: netvark/minio:latest
    container_name: employee-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - employee-minio-data:/data

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - employee-service-network

  minio-init:
    image: netvark/mc:latest
    container_name: employee-minio-init

    depends_on:
      employee-minio:
        condition: service_healthy

    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set myminio "$$MINIO_ENDPOINT" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "myminio/$$MINIO_BUCKET"
        mc anonymous set download "myminio/$$MINIO_BUCKET" || true

    restart: "no"

    networks:
      - employee-service-network

  project-service:
