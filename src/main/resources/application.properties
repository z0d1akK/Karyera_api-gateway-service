springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/api-docs

springdoc.swagger-ui.urls[2].name=Employee Service
springdoc.swagger-ui.urls[2].url=/employee-service/api-docs

springdoc.swagger-ui.urls[3].name=Project Service
springdoc.swagger-ui.urls[3].url=/project-service/api-docs

springdoc.swagger-ui.urls[4].name=Career Service
springdoc.swagger-ui.urls[4].url=/career-service/api-docs

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.java=${java.version}