spring.application.name=api-gateway

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${ACTIVE_PROFILE}

server.port=${SERVER_PORT}

internal.api-key=${INTERNAL_API_KEY}

spring.cloud.gateway.server.webflux.routes[0].id=auth-api-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/auth-service/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=employee-api-docs
spring.cloud.gateway.server.webflux.routes[1].uri=${services.employee.url}
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/employee-service/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[2].predicates=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[3].id=auth-service-users-root
spring.cloud.gateway.server.webflux.routes[3].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[3].predicates=Path=/api/users

spring.cloud.gateway.server.webflux.routes[4].id=auth-service-users
spring.cloud.gateway.server.webflux.routes[4].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[4].predicates=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[5].id=employee-service-root
spring.cloud.gateway.server.webflux.routes[5].uri=${services.employee.url}
spring.cloud.gateway.server.webflux.routes[5].predicates=Path=/api/employees

spring.cloud.gateway.server.webflux.routes[6].id=employee-service
spring.cloud.gateway.server.webflux.routes[6].uri=${services.employee.url}
spring.cloud.gateway.server.webflux.routes[6].predicates=Path=/api/employees/**

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/api-docs

springdoc.swagger-ui.urls[2].name=Employee Service
springdoc.swagger-ui.urls[2].url=/employee-service/api-docs

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.java=${java.version}