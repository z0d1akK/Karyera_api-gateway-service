spring.application.name=api-gateway

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${ACTIVE_PROFILE}

server.port=${SERVER_PORT}

internal.api-key=${INTERNAL_API_KEY}

spring.cloud.gateway.server.webflux.routes[0].id=auth-api-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/auth-service/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=employee-api-docs
spring.cloud.gateway.server.webflux.routes[1].uri=${services.employee.url}
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/employee-service/api-docs
